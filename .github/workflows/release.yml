name: Build and release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed --name TenWinters
          --collect-all pygame --distpath dist main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenWinters-windows
          path: dist/TenWinters.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TenWinters.exe
          name: "Ten Winters — Alpha 0.1"
          prerelease: true
          generate_release_notes: true
          body: |
            Альфа-версия 0.1. Визуальная новелла, 2020-2030.

            ## Запуск
            Скачай `TenWinters.exe` и запусти — Python не нужен,
            всё собрано в один файл. Окно поддерживает 2K/4K и
            изменение размера; `F11` — полноэкранный режим, `Esc` — выход
            из него.

            ## Из исходников
            ```
            pip install -r requirements.txt
            python3 main.py          # графическое окно
            python3 main.py --text   # терминальная версия, без зависимостей
            ```

            Подробности, список реальных фигур в игре и правила
            расширения сюжета — в `README.md`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
