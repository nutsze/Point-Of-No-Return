name: Build and release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed --name TenWinters
          --collect-all pygame
          --add-data "assets/fonts;assets/fonts"
          --add-data "assets/photos;assets/photos"
          --add-data "assets/audio;assets/audio"
          --distpath dist main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenWinters-windows
          path: dist/TenWinters.exe

      - name: Attach EXE to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TenWinters.exe
          body: |
            **Ten Winters** — визуальная новелла о десяти годах российской истории, 2020–2030.

            Скачай `TenWinters.exe` и запусти. Python не нужен.
            F11 — полный экран, M — звук, Esc — пауза.
